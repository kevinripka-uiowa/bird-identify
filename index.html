<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tricky Bird IDs</title>
<meta name="description" content="Field notes for separating tricky Iowa birds.">
<style>
  :root {
    --bg: #f6f4ef; --surface: #ffffff; --ink: #22262b; --muted: #5d646c;
    --line: #dcd8cf; --accent: #b8741a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17191c; --surface: #202328; --ink: #e7e9ec; --muted: #a2a9b1;
      --line: #353a41; --accent: #f0b65a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
  .kicker { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  h1 { font-size: clamp(28px, 5vw, 40px); line-height: 1.15; margin: 0 0 10px; }
  .lede { font-size: 18px; color: var(--muted); margin: 0 0 28px; }
  .pages { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  .pages a {
    display: block; text-decoration: none; color: inherit;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px; transition: border-color .15s;
  }
  .pages a:hover, .pages a:focus-visible { border-color: var(--accent); outline: none; }
  .pages strong { display: block; font-size: 18px; }
  .pages strong::after { content: " →"; color: var(--accent); }
  .pages span { color: var(--muted); }
</style>
</head>
<body>
<main>
  <p class="kicker">Field notes · Iowa</p>
  <h1>Tricky Bird IDs</h1>
  <p class="lede">Quick decoders for birds that are easy to get wrong.</p>

  <!-- Add a new <li> here for each new bird page -->
  <ul class="pages">
    <li>
      <a href="juncos.html">
        <strong>Dark-eyed Juncos</strong>
        <span>Slate-colored, Cassiar, Oregon, Pink-sided, White-winged and Gray-headed: three checks, a decoder table and common pitfalls.</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
